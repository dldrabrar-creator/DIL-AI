<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>DIL AI</title>
<style>
:root{--bg:#0b1020;--panel:#141c31;--panel2:#1b2741;--text:#f4f7ff;--muted:#9eabc5;--a:#8791ff;--b:#40d6c4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#26396d 0,#0b1020 52%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:14px}
header{display:flex;align-items:center;gap:11px;padding:10px 3px 16px;border-bottom:1px solid #ffffff18}
.logo{height:46px;width:46px;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#071321;font-weight:950;font-size:25px;box-shadow:0 8px 25px #6475ff33}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.status{margin-left:auto;font-size:11px;color:#b9f5e9;border:1px solid #40d6c455;padding:6px 9px;border-radius:30px}
.toolbar{display:flex;gap:8px;padding:12px 0}.small{background:#ffffff0c;border:1px solid #ffffff1c;color:#dce4ff;border-radius:11px;padding:8px 11px;font-size:12px}
main{flex:1;padding:10px 0 16px}.welcome{text-align:center;padding:22px 8px}.orb{height:68px;width:68px;border-radius:23px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#071321;font-size:30px;font-weight:900;margin:0 auto 14px}.welcome h2{margin:0 0 8px;font-size:23px}.welcome p{color:var(--muted);font-size:13px;line-height:1.7;margin:0}
.examples{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 18px}.example{text-align:left;border:1px solid #ffffff18;background:#ffffff09;color:#e2e8ff;padding:13px;border-radius:14px;font-size:13px}
#chat{display:flex;flex-direction:column;gap:11px}.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#6678ee;color:white;border-bottom-right-radius:5px}.bot{align-self:flex-start;background:var(--panel2);border:1px solid #ffffff12;border-bottom-left-radius:5px}.actions{display:flex;gap:8px;margin-top:7px}.actions button{font-size:11px;padding:5px 9px}
.notice{color:#aab6d0;font-size:11px;text-align:center;line-height:1.6;margin:12px 4px}
.composer{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(transparent,#0b1020 18%)}.inputrow{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid #ffffff24;border-radius:18px;padding:7px}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;padding:10px 6px;font-size:15px}input::placeholder{color:#8794b0}
button{cursor:pointer}.send,.mic{border:0;border-radius:13px;min-height:44px;font-weight:800}.send{padding:0 15px;background:linear-gradient(135deg,var(--a),var(--b));color:#071321}.mic{width:45px;background:#263452;color:white;font-size:20px}.mic.on{background:#e36b78;color:#fff}.foot{text-align:center;color:#71809f;font-size:10px;padding:8px}
@media(max-width:430px){.examples{grid-template-columns:1fr}.app{padding:11px}}
</style></head>
<body><div class="app">
<header><div class="logo">D</div><div><h1>DIL AI</h1><div class="sub">آپ کا اپنا ذہین اسسٹنٹ</div></div><div class="status">پروٹوٹائپ</div></header>
<div class="toolbar"><button class="small" onclick="newChat()">＋ نئی چیٹ</button><button class="small" onclick="clearHistory()">چیٹ صاف کریں</button><button class="small" onclick="toggleVoice()" id="voiceToggle">🔊 آواز آن</button></div>
<main>
<section class="welcome" id="welcome"><div class="orb">D</div><h2>السلام علیکم! 👋</h2><p>میں DIL AI کا ابتدائی پروٹوٹائپ ہوں۔ آپ لکھ کر یا مائیک سے بول کر سوال آزما سکتے ہیں۔</p></section>
<div class="examples" id="examples">
<button class="example" onclick="ask('مجھے انگریزی سکھائیں')">📘 مجھے انگریزی سکھائیں</button>
<button class="example" onclick="ask('ایک اچھی کہانی سنائیں')">📖 ایک اچھی کہانی سنائیں</button>
<button class="example" onclick="ask('موبائل ایپ کیسے بناتے ہیں؟')">📱 ایپ کیسے بناتے ہیں؟</button>
<button class="example" onclick="ask('پاکستان کے بارے میں بتائیں')">🇵🇰 پاکستان کے بارے میں بتائیں</button>
</div><div id="chat"></div>
<p class="notice" id="notice">اہم: یہ ابھی چیٹ اور آواز کا پروٹوٹائپ ہے، حقیقی AI ماڈل ابھی منسلک نہیں۔ اس لیے جوابات نمونہ ہیں۔</p>
</main>
<div class="composer"><div class="inputrow">
<button class="mic" id="mic" title="بول کر سوال کریں" onclick="startVoice()">🎤</button>
<input id="prompt" placeholder="اپنا سوال یہاں لکھیں..." autocomplete="off">
<button class="send" onclick="send()">بھیجیں</button>
</div></div><div class="foot">DIL AI • Prototype</div></div>
<script>
const $=id=>document.getElementById(id), chat=$('chat'), input=$('prompt');
let voiceOn=true, recognition=null, started=false;
function add(text,who,save=true){let wrap=document.createElement('div');let d=document.createElement('div');d.className='msg '+who;d.textContent=text;wrap.appendChild(d);
 if(who==='bot'){let a=document.createElement('div');a.className='actions';let b=document.createElement('button');b.className='small';b.textContent='🔊 سنیں';b.onclick=()=>speak(text);a.appendChild(b);wrap.appendChild(a)}
 chat.appendChild(wrap);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
 if(save){let h=JSON.parse(localStorage.getItem('dil_history')||'[]');h.push({text,who});localStorage.setItem('dil_history',JSON.stringify(h.slice(-80)))}
}
function showChat(){ $('welcome').style.display='none';$('examples').style.display='none';$('notice').style.display='none'}
function send(){let t=input.value.trim();if(!t)return;showChat();add(t,'user');input.value='';setTimeout(()=>{let r='آپ کا سوال موصول ہوا: "'+t+'"\n\nیہ DIL AI کا پروٹوٹائپ ہے۔ ابھی حقیقی AI ماڈل منسلک نہیں، اس لیے میں فی الحال صرف نمونہ جواب دے سکتا ہوں۔ اگلے مرحلے میں محفوظ طریقے سے AI سروس جوڑنے کا انتظام کریں گے۔';add(r,'bot');if(voiceOn)speak(r)},250)}
function ask(t){input.value=t;send()}
function speak(t){if(!('speechSynthesis'in window)){alert('اس براؤزر میں آواز پڑھنے کی سہولت دستیاب نہیں۔');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ur-PK';u.rate=.92;speechSynthesis.speak(u)}
function toggleVoice(){voiceOn=!voiceOn;$('voiceToggle').textContent=voiceOn?'🔊 آواز آن':'🔇 آواز بند'}
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('اس فائل میں براؤزر کا مائیک دستیاب نہیں۔ Chrome میں کھلی ویب سائٹ پر آزمائیں، یا کی بورڈ کے مائیک سے بول کر لکھیں۔');return}
 try{recognition=new SR();recognition.lang='ur-PK';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{$('mic').classList.add('on');$('mic').textContent='⏺'};recognition.onend=()=>{$('mic').classList.remove('on');$('mic').textContent='🎤'};recognition.onerror=()=>alert('مائیک اجازت یا براؤزر کی وجہ سے کام نہیں کر سکا۔');recognition.onresult=e=>{input.value=(input.value+' '+e.results[0][0].transcript).trim();input.focus()};recognition.start()}catch(e){alert('مائیک شروع نہیں ہو سکا۔')}
}
function newChat(){chat.innerHTML='';localStorage.removeItem('dil_history');$('welcome').style.display='block';$('examples').style.display='grid';$('notice').style.display='block'}
function clearHistory(){newChat()}
(function restore(){let h=JSON.parse(localStorage.getItem('dil_history')||'[]');if(h.length){showChat();h.forEach(x=>add(x.text,x.who,false))}})();
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></body></html>
